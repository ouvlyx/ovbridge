<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OvBridge — Onboarding 2/4</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bgDark: '#08090D',
            surface: '#0F1117',
            surfaceRaised: '#161923',
            borderSubtle: '#1E2230',
            borderStrong: '#2A2F40',
            primaryViolet: '#7C5CFF',
            primaryGlow: '#9B87FF',
            accentCyan: '#00E5CC',
            neonGreen: '#22E67E',
            textPrimary: '#F5F6FA',
            textSecondary: '#9096A6',
            textMuted: '#5A6172',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Geist', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #08090D;
      color: #F5F6FA;
      font-family: 'Inter', sans-serif;
    }
    .glow-green {
      box-shadow: 0 0 50px -10px rgba(34, 230, 126, 0.4), 0 0 24px -6px rgba(0, 229, 204, 0.25);
    }
    .btn-violet-glow {
      box-shadow: 0 0 30px -6px rgba(124, 92, 255, 0.5);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 md:p-6 bg-[#040507]">
  <!-- Mobile Container 375x812 -->
  <main class="w-[375px] h-[812px] bg-[#08090D] relative flex flex-col justify-between overflow-hidden shadow-2xl rounded-[36px] border border-[#1E2230] p-6 selection:bg-[#22E67E]/30">
    <!-- Ambient glows -->
    <div class="absolute -top-20 right-0 w-72 h-72 rounded-full bg-[#22E67E]/12 blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-20 -left-20 w-60 h-60 rounded-full bg-[#7C5CFF]/15 blur-3xl pointer-events-none"></div>

    <!-- Top Bar -->
    <header class="relative z-10 flex items-center justify-between pt-2">
      <button class="text-[13px] font-medium text-[#9096A6] hover:text-[#F5F6FA] flex items-center gap-1.5 py-1 px-2.5 rounded-full hover:bg-[#161923] transition-colors">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
        </svg>
        <span>Retour</span>
      </button>
      <a href="#passer" class="text-[13px] font-medium text-[#9096A6] hover:text-[#F5F6FA] transition-colors py-1 px-2.5 rounded-full hover:bg-[#161923]">Passer</a>
    </header>

    <!-- Center Content -->
    <section class="relative z-10 flex flex-col items-center text-center my-auto px-1">
      <!-- 120px Icon container: Lock (green #22E67E tinted) -->
      <div class="relative w-[120px] h-[120px] rounded-[32px] p-[1px] bg-gradient-to-br from-[#22E67E] via-[#22E67E]/50 to-[#00E5CC] glow-green mb-8 transition-transform duration-300 hover:scale-105">
        <div class="w-full h-full bg-[#0F1117] rounded-[31px] flex items-center justify-center relative overflow-hidden">
          <div class="absolute inset-0 bg-gradient-to-br from-[#22E67E]/15 to-[#00E5CC]/10 opacity-70"></div>
          <!-- Padlock Icon -->
          <svg class="w-14 h-14 text-[#22E67E] relative z-10" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
          </svg>
        </div>
      </div>

      <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#161923] border border-[#1E2230] mb-3">
        <span class="w-1.5 h-1.5 rounded-full bg-[#22E67E]"></span>
        <span class="text-[11px] font-mono font-medium text-[#22E67E] tracking-wide uppercase">Sécurité // Protocole E2EE</span>
      </div>

      <h1 class="font-display font-semibold text-[24px] leading-[32px] text-[#F5F6FA] mb-1.5">
        Chiffrement Zero-Knowledge
      </h1>
      
      <p class="text-[13px] leading-[18px] font-medium text-[#00E5CC] mb-3 tracking-wide">
        Confidentialité absolue
      </p>

      <p class="text-[14px] leading-[22px] text-[#9096A6] max-w-[310px]">
        Vos clés cryptographiques sont générées localement. Vos fichiers sont chiffrés avant même d'être envoyés.
      </p>
    </section>

    <!-- Bottom Controls -->
    <footer class="relative z-10 flex flex-col gap-5 pb-2">
      <!-- 4 dots indicator (step 2 active) -->
      <div class="flex items-center justify-center gap-2" aria-label="Pagination étape 2 sur 4">
        <span class="w-2 h-2 rounded-full bg-[#1E2230]"></span>
        <span class="w-7 h-2 rounded-full bg-[#7C5CFF] transition-all duration-300"></span>
        <span class="w-2 h-2 rounded-full bg-[#1E2230]"></span>
        <span class="w-2 h-2 rounded-full bg-[#1E2230]"></span>
      </div>

      <!-- Action Button -->
      <button class="w-full h-[52px] rounded-2xl bg-gradient-to-r from-[#7C5CFF] to-[#9B87FF] text-[#F5F6FA] font-medium text-[15px] flex items-center justify-center gap-2 btn-violet-glow hover:opacity-95 active:scale-[0.98] transition-all">
        <span>Suivant</span>
        <svg class="w-4 h-4 text-[#F5F6FA]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
        </svg>
      </button>
    </footer>
  </main>
</body>
</html>
