  </head><body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col select-none"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full relative overflow-hidden select-none pb-safe">
<!-- Dynamic Acoustic Backlight & Gradient Ambience -->
<div class="absolute inset-0 pointer-events-none bg-gradient-to-b from-[#1E1035] via-[#120d24] to-[#08090D] opacity-95"></div>
<div class="absolute -top-24 left-1/2 -translate-x-1/2 w-96 h-96 bg-primary-container/20 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute top-1/3 left-1/2 -translate-x-1/2 w-80 h-80 bg-secondary/15 rounded-full blur-[90px] pointer-events-none"></div>
<!-- Content Canvas -->
<div class="relative z-10 flex flex-col justify-between px-space-lg pt-space-md min-h-[760px] pb-space-xl">
<!-- Top Pill: Status Cryptographique E2E -->
<div class="flex justify-center w-full">
<div class="inline-flex items-center gap-space-sm bg-surface-container-high/80 backdrop-blur-md px-space-md py-1.5 rounded-full shadow-sm shadow-primary/10">
<span class="relative flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-secondary opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-secondary"></span>
</span>
<span class="material-symbols-outlined text-secondary text-sm" style="font-variation-settings: 'FILL' 1;">videocam</span>
<span class="font-code-sm text-code-sm text-on-surface tracking-wide">Appel entrant · Vidéo E2E</span>
</div>
</div>
<!-- Center Section: Rings, Avatar & Cryptographic Metadata -->
<div class="flex flex-col items-center justify-center relative my-auto py-4">
<!-- Concentric Resonating Soundwave Rings -->
<div class="relative flex items-center justify-center w-80 h-80">
<!-- Ring 3 (Outer ripple) -->
<div class="absolute w-[320px] h-[320px] rounded-full bg-primary/5 animate-ping opacity-25 duration-[3000ms]"></div>
<!-- Ring 2 (Middle pulse) -->
<div class="absolute w-[260px] h-[260px] rounded-full bg-gradient-to-tr from-primary/15 to-secondary/15 animate-pulse duration-[2200ms]"></div>
<!-- Ring 1 (Inner resonance) -->
<div class="absolute w-[200px] h-[200px] rounded-full bg-surface-container-high/60 backdrop-blur-sm"></div>
<!-- Central Glow Halo -->
<div class="absolute w-44 h-44 rounded-full bg-primary/20 blur-xl"></div>
<!-- Avatar Node with Dual Gradient Trim -->
<div class="relative w-[140px] h-[140px] rounded-full p-1 bg-gradient-to-tr from-primary via-surface-tint to-secondary shadow-xl shadow-primary/20 flex items-center justify-center">
<div class="w-full h-full rounded-full overflow-hidden bg-surface-container-lowest relative">
<img class="w-full h-full object-cover" data-alt="Close-up portrait of a chic Senegalese woman named Fatou Diop with braided hairstyle, subtle studio violet and soft teal rim lighting, serene confident expression, dark obsidian background matching tech aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCF_MYCWGHArlGn904PFSz3mhWx4wlA7z3ZZFzJMZxC8kbectavudSVGhg9R-hQkpYABL3C_KeCpiTGzlDRu1YjpkU6lVhqVyF-HhWkABSKyVeTFGvQmQ9WqM05GJZhoe4GW3RDIVPK1fcoJ-TfqFphdbsdtwuCAkyidyeMswAun_pSpgQMESB4tyYqQscEv3cYOKquJVCj5DS1hikfApWCpy3lEHssERleoGSyLsClng_4PcWopavSzw"/>
</div>
<!-- Realtime E2E Verified Emblem -->
<div class="absolute bottom-1 right-1 bg-surface-container-lowest p-1 rounded-full shadow-md">
<div class="w-6 h-6 rounded-full bg-tertiary-container flex items-center justify-center text-on-tertiary-container">
<span class="material-symbols-outlined text-xs" style="font-variation-settings: 'FILL' 1;">verified_user</span>
</div>
</div>
</div>
</div>
<!-- Caller Details & Sovereign Device Identity -->
<div class="flex flex-col items-center text-center mt-space-md max-w-xs">
<h1 class="font-headline-xl text-headline-xl text-on-surface tracking-tight font-semibold">
          Fatou Diop
        </h1>
<div class="flex items-center gap-1.5 mt-1 text-on-surface-variant">
<span class="material-symbols-outlined text-sm text-secondary">phone_iphone</span>
<span class="font-body-sm text-body-sm">Appareil vérifié · iPhone 15 Pro</span>
</div>
<!-- Sovereign Key Fingerprint -->
<div class="mt-space-sm inline-flex items-center gap-1.5 bg-surface-container-low px-space-md py-1 rounded-full">
<span class="w-1.5 h-1.5 rounded-full bg-secondary"></span>
<span class="font-code-sm text-code-sm text-secondary tracking-wider uppercase">
            SHA-256 : 84ac • 91b2
          </span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant/80 mt-2">
          Connexion peer-to-peer chiffrée sans serveur
        </p>
</div>
</div>
<!-- Bottom Interactive Control Deck -->
<div class="flex flex-col items-center w-full gap-space-lg">
<!-- Quick Message Action -->
<button class="inline-flex items-center gap-2 px-space-lg py-2 rounded-full bg-surface-container/70 hover:bg-surface-container-high text-on-surface text-body-sm font-body-sm transition-all active:scale-95 shadow-sm" id="quickReplyBtn">
<span class="material-symbols-outlined text-base text-primary">chat_bubble</span>
<span>Envoyer un message rapide</span>
</button>
<!-- Primary Call Control Dials -->
<div class="flex items-center justify-around w-full max-w-xs px-space-md">
<!-- Hangup / Decline Action -->
<div class="flex flex-col items-center gap-2">
<button aria-label="Refuser l'appel entrant" class="relative group w-[72px] h-[72px] rounded-full bg-error-container hover:bg-error text-on-error flex items-center justify-center shadow-lg shadow-error-container/40 active:scale-90 transition-all duration-200" id="declineBtn">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">call_end</span>
</button>
<span class="font-body-md text-body-md text-on-surface/90 font-medium tracking-tight">Refuser</span>
</div>
<!-- Answer / Accept Video Call Action -->
<div class="flex flex-col items-center gap-2">
<div class="relative flex items-center justify-center">
<!-- Pulsing Halo on Accept Dial -->
<span class="absolute w-[88px] h-[88px] rounded-full bg-tertiary-container/30 animate-ping duration-1000"></span>
<button aria-label="Accepter l'appel vidéo" class="relative z-10 w-[72px] h-[72px] rounded-full bg-tertiary-container hover:bg-tertiary text-on-tertiary-container flex items-center justify-center shadow-lg shadow-tertiary-container/50 active:scale-90 transition-all duration-200" id="acceptBtn">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">videocam</span>
</button>
</div>
<span class="font-body-md text-body-md text-on-surface/90 font-medium tracking-tight">Répondre</span>
</div>
</div>
</div>
</div>
<!-- Micro-interaction Script for Sensory Feedback -->
<script>
    (function() {
      const declineBtn = document.getElementById('declineBtn');
      const acceptBtn = document.getElementById('acceptBtn');
      const quickReplyBtn = document.getElementById('quickReplyBtn');

      if (declineBtn) {
        declineBtn.addEventListener('click', () => {
          declineBtn.classList.add('scale-75', 'opacity-50');
          setTimeout(() => {
            const container = declineBtn.closest('.flex-col');
            if (container) container.style.opacity = '0.3';
          }, 150);
        });
      }

      if (acceptBtn) {
        acceptBtn.addEventListener('click', () => {
          acceptBtn.classList.add('scale-110');
          const badge = document.querySelector('.font-code-sm');
          if (badge) badge.textContent = "Établissement du canal direct...";
        });
      }

      if (quickReplyBtn) {
        quickReplyBtn.addEventListener('click', () => {
          quickReplyBtn.classList.add('bg-primary', 'text-on-primary');
          setTimeout(() => {
            quickReplyBtn.classList.remove('bg-primary', 'text-on-primary');
          }, 400);
        });
      }
    })();
  </script>
</div></main></body></html>
