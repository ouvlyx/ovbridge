<script>
  (function() {
    const states = [
      "Initialisation du canal chiffré E2E…",
      "Échange des clés éphémères X25519…",
      "Vérification de l'empreinte cryptographique…",
      "Synchronisation du maillage local…"
    ];
    let step = 0;
    const terminalText = document.getElementById("crypto-terminal-text");
    const progressBar = document.getElementById("progress-bar");

    setInterval(() => {
      step = (step + 1) % states.length;
      if (terminalText) {
        terminalText.style.opacity = "0.3";
        setTimeout(() => {
          terminalText.textContent = states[step];
          terminalText.style.opacity = "1";
        }, 180);
      }
      if (progressBar) {
        const widths = ["35%", "58%", "82%", "96%"];
        progressBar.style.width = widths[step];
      }
    }, 1800);
  })();
