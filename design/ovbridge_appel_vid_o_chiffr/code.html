</div>

<!-- Spatial Encryption Status Notification Toast (Micro Moment) -->
<div class="absolute top-18 inset-x-4 flex justify-center z-10 pointer-events-none">

<!-- Pip Video Preview -->
<img class="w-full h-full object-cover scale-x-[-1]" data-alt="Selfie camera frame of young digital engineer looking into front lens during a night coding session. Soft violet keyboard reflections, high quality mirrored mobile frame, smiling casually in a sleek contemporary room with soft ambient lighting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBsGLC8MV-lVCVGiXLWEyOCCxbbEaTN13RAAUx6MglvZZOrvnkKKD2atJouUbSA04UytUT1Rqd23dM_yywCXpUwrzVSwc-iYPn1vVw4YMVLKohRvGx6NmfpF1w7JQXXLoyjyuXGtust1Bi9VOik4IhRomCcvJe_A857Y0zTyM9CTi3iXpAkIS9BRwkttg7e8YjDhOTnwjmyBMprXHcSv5hGjoPtyKzu2Paz8BtaEqcAtQaHNc8tRAbLJA"/>
<!-- Subtle PiP Gradient Scrim -->
<div class="absolute inset-x-0 bottom-0 h-12 bg-gradient-to-t from-surface-container-lowest/90 to-transparent pointer-events-none"></div>
<!-- Local Device Indicator Pill -->
<div class="absolute bottom-2 left-2 right-2 flex items-center justify-between">
<span class="font-code-sm text-code-sm text-on-surface bg-surface-container-lowest/80 px-1.5 py-0.5 rounded-full flex items-center gap-1">
<span class="w-1.5 h-1.5 rounded-full bg-tertiary"></span>
          Vous
        </span>
<span class="material-symbols-outlined text-[14px] text-primary bg-surface-container-lowest/80 p-0.5 rounded-full">mic</span>
</div>
<!-- PiP Toggle Overlay Button -->
<button aria-label="Agrandir aperçu" class="absolute top-1.5 right-1.5 w-6 h-6 rounded-full bg-surface-container-lowest/70 backdrop-blur-sm flex items-center justify-center text-on-surface opacity-80 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-[12px]">open_in_full</span>
</button>
</div>
<!-- Live Audio Activity Waveform Capsule (Floating on left edge) -->
<div class="absolute bottom-32 left-3 z-10 flex items-center gap-1.5 bg-surface-container-low/85 backdrop-blur-md px-2.5 py-1.5 rounded-full shadow-md">
<span class="material-symbols-outlined text-[15px] text-secondary">graphic_eq</span>
<div class="flex items-end gap-0.5 h-3">
<span class="w-0.5 h-1.5 bg-secondary rounded-full animate-bounce"></span>

<span class="w-0.5 h-2 bg-secondary rounded-full animate-bounce" style="animation-delay: 240ms"></span>

</div>

<div class="absolute bottom-4 inset-x-3 z-30">

<button aria-label="Activer ou couper le micro" class="w-12 h-12 rounded-full bg-surface-container-high text-on-surface flex items-center justify-center transition-all active:scale-95 hover:bg-surface-container-highest" id="toggle-mic">

<span class="material-symbols-outlined text-[22px]" id="cam-icon">videocam</span>
</button>

</div>

<div class="flex flex-col items-center gap-1 -mt-2">

<span class="material-symbols-outlined text-[26px]" style="font-variation-settings: 'FILL' 1;">call_end</span>

</div>

<div class="flex flex-col items-center gap-1">
<button aria-label="Partager l'écran" class="w-12 h-12 rounded-full bg-surface-container-high text-on-surface flex items-center justify-center transition-all active:scale-95 hover:bg-surface-container-highest" id="toggle-share">
<span class="material-symbols-outlined text-[22px]" id="share-icon">screen_share</span>
</button>
<span class="font-body-sm text-body-sm text-on-surface-variant font-medium">Partager</span>
</div>
<!-- 5. Options / Plus -->
<div class="flex flex-col items-center gap-1">
<button aria-label="Options d'appel" class="w-12 h-12 rounded-full bg-surface-container-high text-on-surface flex items-center justify-center transition-all active:scale-95 hover:bg-surface-container-highest" id="btn-options">
<span class="material-symbols-outlined text-[22px]">tune</span>
</button>
<span class="font-body-sm text-body-sm text-on-surface-variant font-medium">Options</span>
</div>
</div>
</div>

<!-- Interactive Logic for In-Call Moments of Delight -->
<script>
    (function() {
      // Dynamic call counter incrementation
      let seconds = 258;
      const timerElement = document.getElementById('call-timer');
      setInterval(() => {
        seconds++;
        const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
        const secs = String(seconds % 60).padStart(2, '0');
        if (timerElement) {
          timerElement.textContent = `${mins}:${secs}`;
        }
      }, 1000);

      // Micro mute toggle
      const micBtn = document.getElementById('toggle-mic');
      const micIcon = document.getElementById('mic-icon');
      let isMicMuted = false;
      if (micBtn && micIcon) {
        micBtn.addEventListener('click', () => {
          isMicMuted = !isMicMuted;
          if (isMicMuted) {
            micIcon.textContent = 'mic_off';
            micBtn.classList.remove('bg-surface-container-high', 'text-on-surface');
            micBtn.classList.add('bg-error-container', 'text-error');
          } else {
            micIcon.textContent = 'mic';
            micBtn.classList.remove('bg-error-container', 'text-error');
            micBtn.classList.add('bg-surface-container-high', 'text-on-surface');
          }
        });
      }

      // Camera mute toggle
      const camBtn = document.getElementById('toggle-cam');
      const camIcon = document.getElementById('cam-icon');
      let isCamOff = false;
      if (camBtn && camIcon) {
        camBtn.addEventListener('click', () => {
          isCamOff = !isCamOff;
          if (isCamOff) {
            camIcon.textContent = 'videocam_off';
            camBtn.classList.remove('bg-surface-container-high', 'text-on-surface');
            camBtn.classList.add('bg-error-container', 'text-error');
          } else {
            camIcon.textContent = 'videocam';
            camBtn.classList.remove('bg-error-container', 'text-error');
            camBtn.classList.add('bg-surface-container-high', 'text-on-surface');
          }
        });
      }

      // Screen Share toggle
      const shareBtn = document.getElementById('toggle-share');
      const shareIcon = document.getElementById('share-icon');
      let isSharing = false;
      if (shareBtn && shareIcon) {
        shareBtn.addEventListener('click', () => {
          isSharing = !isSharing;
          if (isSharing) {
            shareBtn.classList.remove('bg-surface-container-high', 'text-on-surface');
            shareBtn.classList.add('bg-secondary-container', 'text-on-secondary-container');
          } else {
            shareBtn.classList.remove('bg-secondary-container', 'text-on-secondary-container');
            shareBtn.classList.add('bg-surface-container-high', 'text-on-surface');
          }
        });
      }

      // Pip click bounce
      const pip = document.getElementById('pip-container');
      if (pip) {
        pip.addEventListener('click', () => {
          pip.classList.add('scale-105');
          setTimeout(() => pip.classList.remove('scale-105'), 200);
        });
      }
    })();
  </script>
